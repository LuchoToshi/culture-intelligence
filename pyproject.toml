[project]
name = "culture-intelligence"
version = "0.1.0"
description = "Cultural intelligence platform: monitors fashion, culture and urban taste sources, analyzes content, and produces weekly intelligence reports."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "feedparser>=6.0.14",
    "trafilatura>=2.2.0",
    "yt-dlp>=2026.8.19",
    "youtube-transcript-api>=1.2.4",
    "anthropic>=1.0.0",
    "brotli>=1.2.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[project.scripts]
culture = "culture.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/culture"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Typer's Option-in-default is the framework's intended pattern.
ignore = ["B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["src/culture"]
ignore_missing_imports = true
check_untyped_defs = true
