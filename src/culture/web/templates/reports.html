{% extends "base.html" %}
{% block title %}Reports — Culture Intelligence{% endblock %}
{% block content %}
<h1>Weekly Reports</h1>
{% if reports %}
<ul>
  {% for name in reports %}<li><a href="/reports/{{ name }}">{{ name }}</a></li>{% endfor %}
</ul>
{% else %}
<p class="empty">No reports yet — run <code>uv run culture report --days 7</code>.</p>
{% endif %}
{% endblock %}
