{% extends "admin_base.html" %}
{% block title %}{{ "Edit source" if source and source.id else "Add source" }}{% endblock %}
{% block content %}
<p class="eyebrow">Admin</p>
<h1>{{ "Edit source" if source and source.id else "Add source" }}</h1>
{% if error %}<p class="lede" style="color:var(--ci-oxblood);">{{ error }}</p>{% endif %}
<form method="post" action="{{ '/admin/sources/' + source.id | string + '/edit' if source and source.id else '/admin/sources/new' }}" style="max-width:520px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <p>
    <label style="display:block; margin-bottom:4px;">Name</label>
    <input type="text" name="name" required value="{{ source.name if source else '' }}"
           style="width:100%; font:inherit; padding:6px 10px; border:var(--ci-rule-mid); background:transparent;">
  </p>
  <p>
    <label style="display:block; margin-bottom:4px;">Platform</label>
    <select name="platform" required style="width:100%; font:inherit; padding:6px 10px; border:var(--ci-rule-mid); background:transparent;">
      {% for p in platforms %}
        <option value="{{ p }}" {% if source and source.platform == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </p>
  <p>
    <label style="display:block; margin-bottom:4px;">Profile / canonical URL (Instagram, TikTok, X, YouTube channel)</label>
    <input type="text" name="url" value="{{ source.url if source else '' }}"
           style="width:100%; font:inherit; padding:6px 10px; border:var(--ci-rule-mid); background:transparent;">
  </p>
  <p>
    <label style="display:block; margin-bottom:4px;">Feed URL (RSS/podcast/web/newsletter)</label>
    <input type="text" name="feed_url" value="{{ source.feed_url if source else '' }}"
           style="width:100%; font:inherit; padding:6px 10px; border:var(--ci-rule-mid); background:transparent;">
  </p>
  <p>
    <label style="display:block; margin-bottom:4px;">Handle / channel ID (Instagram @handle, YouTube channel ID)</label>
    <input type="text" name="external_identifier" value="{{ source.external_identifier if source else '' }}"
           style="width:100%; font:inherit; padding:6px 10px; border:var(--ci-rule-mid); background:transparent;">
  </p>
  <p>
    <label style="display:block; margin-bottom:4px;">City</label>
    <input type="text" name="city" value="{{ source.city if source else '' }}"
           style="width:100%; font:inherit; padding:6px 10px; border:var(--ci-rule-mid); background:transparent;">
  </p>
  <p>
    <label style="display:block; margin-bottom:4px;">Collection method</label>
    <input type="text" name="collection_method" value="{{ source.collection_method if source else '' }}"
           placeholder="manual_review, apify_social, youtube_api..."
           style="width:100%; font:inherit; padding:6px 10px; border:var(--ci-rule-mid); background:transparent;">
  </p>
  <p>
    <label style="display:block; margin-bottom:4px;">Cadence</label>
    <select name="cadence" style="width:100%; font:inherit; padding:6px 10px; border:var(--ci-rule-mid); background:transparent;">
      {% for c in cadences %}
        <option value="{{ c }}" {% if source and source.cadence == c or (not source and c == "weekly") %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
  </p>
  <p>
    <label style="display:block; margin-bottom:4px;">Editorial notes</label>
    <textarea name="collection_notes" rows="3"
              style="width:100%; font:inherit; padding:6px 10px; border:var(--ci-rule-mid); background:transparent;">{{ source.collection_notes if source else '' }}</textarea>
  </p>
  <button class="btn primary" type="submit">{{ "Save" if source and source.id else "Add source" }}</button>
  <a class="btn" href="/admin/sources">Cancel</a>
</form>
{% endblock %}
