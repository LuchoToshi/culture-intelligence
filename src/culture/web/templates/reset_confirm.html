<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password - Culture Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
{% include "_tokens.css" %}
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--ci-paper); font:14px/1.55 var(--ci-font-text); color:var(--ci-ink);
         padding:1.5rem; }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline:2px solid var(--ci-oxblood); outline-offset:2px; }
  .panel { border:var(--ci-rule-mid); padding:2.4rem 2.2rem; width:100%; max-width:400px; }
  .brand { font:600 11px var(--ci-font-text); letter-spacing:var(--ci-track-brand);
           text-transform:uppercase; margin:0 0 1rem; }
  h1 { font-family:var(--ci-font-display); font-weight:400; font-size:26px;
       line-height:var(--ci-leading-tight); margin:0 0 0.4rem; }
  p.lede { color:var(--ci-ink-3); margin:0 0 1.6rem; font-size:13px; }
  label { display:block; font:500 9px var(--ci-font-text); letter-spacing:var(--ci-track-label);
          text-transform:uppercase; color:var(--ci-ink-4); margin-bottom:0.35rem; }
  input[type=password] { width:100%; font:inherit; padding:0.6rem 0.8rem; border:var(--ci-rule-mid);
    border-radius:0; background:transparent; margin-bottom:1rem; }
  input:focus { outline:2px solid var(--ci-oxblood); outline-offset:1px; border-color:var(--ci-ink); }
  button { width:100%; font:600 11px var(--ci-font-text); letter-spacing:var(--ci-track-chip);
           text-transform:uppercase; color:var(--ci-paper); background:var(--ci-ink);
           border:1px solid var(--ci-ink); border-radius:0; padding:0.75rem; cursor:pointer; }
  button:hover { background:var(--ci-oxblood); border-color:var(--ci-oxblood); }
  .notice { font-size:12px; padding:0.7rem 0; margin-bottom:1.2rem;
            display:flex; gap:10px; align-items:baseline;
            border-top:var(--ci-rule-light); border-bottom:var(--ci-rule-light); }
  .notice::before { content:""; width:7px; height:7px; flex:none; align-self:center; }
  .notice.ok { color:var(--ci-ink-2); }
  .notice.ok::before { background:var(--ci-ink); }
  .notice.err { color:var(--ci-oxblood); }
  .notice.err::before { background:var(--ci-oxblood); }
  .aside { font-size:12px; color:var(--ci-ink-3); margin:1.1rem 0 0; }
</style>
</head>
<body>
  <div class="panel">
    <p class="brand">Culture Intelligence</p>
    <h1>Set a new password</h1>
    {% if invalid %}
      <p class="lede">This link is invalid or has expired.</p>
      <p class="aside"><a href="/reset">Request a new one</a></p>
    {% elif done %}
      <div class="notice ok">Password changed. Sign in with your new password.</div>
      <p class="aside"><a href="/login">Sign in</a></p>
    {% else %}
      {% if error %}
        <div class="notice err">{{ error }}</div>
      {% endif %}
      <form method="post" action="/reset/confirm">
        <input type="hidden" name="token_hash" value="{{ token_hash }}">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" required minlength="8" autofocus>
        <label for="password_confirm">Confirm new password</label>
        <input id="password_confirm" name="password_confirm" type="password" required minlength="8">
        <button type="submit">Set password</button>
      </form>
    {% endif %}
  </div>
</body>
</html>
