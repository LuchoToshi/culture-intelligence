<style>
{% include "_tokens.css" %}
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;

         font:14px/1.55 var(--ci-font-text); padding:1.5rem; }
  a:focus-visible { outline:2px solid var(--ci-oxblood); outline-offset:2px; }

  p { color:var(--ci-ink-3); margin:0 0 1.6rem; }
  nav a { display:inline-block; font:400 11px var(--ci-font-text);
          letter-spacing:var(--ci-track-chip); text-transform:uppercase; color:var(--ci-ink);
          border:var(--ci-rule-mid); padding:0.6rem 1rem; text-decoration:none; }
