<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ status_code }} - Urban Taste Intelligence</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
{% include "_tokens.css" %}
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--ci-paper); color:var(--ci-ink);
         font:14px/1.55 var(--ci-font-text); padding:1.5rem; }
  a:focus-visible { outline:2px solid var(--ci-oxblood); outline-offset:2px; }
  .panel { max-width: 480px; }
  .code { font:600 10px var(--ci-font-text); letter-spacing:var(--ci-track-label);
          text-transform:uppercase; color:var(--ci-oxblood); }
  h1 { font-family:var(--ci-font-display); font-weight:400; font-size:34px;
       line-height:var(--ci-leading-tight); margin:0.5rem 0 0.6rem; letter-spacing:-0.01em; }
  p { color:var(--ci-ink-3); margin:0 0 1.6rem; }
  nav a { display:inline-block; font:400 11px var(--ci-font-text);
          letter-spacing:var(--ci-track-chip); text-transform:uppercase; color:var(--ci-ink);
          border:var(--ci-rule-mid); padding:0.6rem 1rem; margin:0 0.5rem 0.5rem 0;
          text-decoration:none; }
  nav a:hover { border-color:var(--ci-ink); }
  nav a.primary { background:var(--ci-ink); color:var(--ci-paper); border-color:var(--ci-ink); }
  nav a.primary:hover { background:var(--ci-oxblood); border-color:var(--ci-oxblood); }
</style>
</head>
<body>
  <div class="panel">
    <div class="code">{{ status_code }}</div>
    <h1>{% if status_code == 404 %}This page doesn't exist.{% elif status_code == 403 %}You don't have access to this.{% else %}Something went wrong.{% endif %}</h1>
    <p>{{ message }}</p>
    <nav aria-label="Recovery">
      <a class="primary" href="/">Home</a>
      <a href="/intelligence">Intelligence</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/search">Search</a>
    </nav>
  </div>
</body>
</html>
