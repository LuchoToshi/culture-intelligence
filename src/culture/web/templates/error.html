<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ status_code }} — Urban Taste Intelligence</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F2F0EA; --ink:#111111; --ink-2:#55544F; --rule:#D4D1C9; --signal:#FF4B00; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--paper); color:var(--ink);
         font:16px/1.55 "Instrument Sans",-apple-system,sans-serif; padding:1.5rem; }
  .panel { max-width: 480px; }
  .code { font:500 0.78rem "IBM Plex Mono",monospace; letter-spacing:0.14em; color:var(--signal); }
  h1 { font-family:"Newsreader",Georgia,serif; font-weight:500; font-size:1.7rem;
       line-height:1.2; margin:0.5rem 0 0.6rem; letter-spacing:-0.005em; }
  p { color:var(--ink-2); margin:0 0 1.6rem; }
  nav a { display:inline-block; font-weight:500; font-size:0.92rem; color:var(--ink);
          border:1px solid var(--rule); padding:0.5rem 1rem; margin:0 0.5rem 0.5rem 0;
          text-decoration:none; }
  nav a:hover { border-color:var(--ink); }
  nav a.primary { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  nav a.primary:hover { background:var(--signal); border-color:var(--signal); color:#fff; }
</style>
</head>
<body>
  <div class="panel">
    <div class="code">{{ status_code }}</div>
    <h1>{% if status_code == 404 %}This page doesn't exist.{% elif status_code == 403 %}You don't have access to this.{% else %}Something went wrong.{% endif %}</h1>
    <p>{{ message }}</p>
    <nav aria-label="Recovery">
      <a class="primary" href="/">Home</a>
      <a href="/intelligence">Intelligence</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/search">Search</a>
    </nav>
  </div>
</body>
</html>
