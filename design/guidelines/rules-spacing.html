<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Hairline hierarchy: 2px / mid / light" name="Rules" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ci-paper);color:var(--ci-ink);font-family:var(--ci-font-text);padding:20px 24px}</style></head><body>
<div style="border-bottom:2px solid var(--ci-line-heavy);padding-bottom:8px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ci-ink-4)">2px — section / part breaks</div>
<div style="border-bottom:1px solid var(--ci-line-mid);padding:12px 0 8px 0;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ci-ink-4)">1px mid #C9C7BF — group boundaries</div>
<div style="border-bottom:1px solid var(--ci-line-light);padding:12px 0 8px 0;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ci-ink-4)">1px light #E4E2DA — row hairlines (12px dense row padding)</div>
</body></html>
