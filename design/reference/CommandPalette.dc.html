<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ close }}" style="position: fixed; inset: 0; background: rgba(17,17,17,0.34); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; font-family: 'Archivo', sans-serif;">
    <div onClick="{{ stop }}" style="width: 580px; max-width: 90vw; background: #FAFAF7; border: 1px solid #111; color: #111;">
      <input autoFocus="{{ true }}" value="{{ query }}" onChange="{{ onQuery }}" placeholder="Search signals, sources, cities, report sections…" style="width: 100%; box-sizing: border-box; background: transparent; border: none; border-bottom: 1px solid #111; outline: none; font-family: 'Newsreader', serif; font-size: 19px; padding: 16px 18px; color: #111;"></input>
      <div style="display: flex; flex-direction: column; max-height: 46vh; overflow-y: auto;">
        <sc-for list="{{ results }}" as="r" hint-placeholder-count="6">
          <button onClick="{{ r.go }}" style="display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: baseline; text-align: left; background: {{ r.bg }}; border: none; border-bottom: 1px solid #E4E2DA; padding: 10px 18px; cursor: pointer;">
            <span style="font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ r.kindColor }}; font-family: 'Archivo', sans-serif;">{{ r.kind }}</span>
            <span style="font-family: 'Newsreader', serif; font-size: 16px; color: #111;">{{ r.label }}</span>
          </button>
        </sc-for>
        <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
          <div style="padding: 16px 18px; font-family: 'Newsreader', serif; font-style: italic; font-size: 15px; color: #777;">Nothing in the universe matches.</div>
        </sc-if>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 9px 18px; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #999;">
        <span>↑↓ navigate · ↵ open · esc close</span>
        <span>Culture Intelligence</span>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;600px&quot;}}">
class Component extends DCLogic {
  state = { open: false, query: '', idx: 0 };

  index() {
    const sig = n => ({ kind: 'Signal', label: n, href: 'Signal Detail.dc.html' });
    const src = n => ({ kind: 'Source', label: n, href: 'Source Universe.dc.html' });
    const sec = (n, id) => ({ kind: 'Report W35', label: n, href: 'Weekly Report.dc.html#' + id });
    return [
      { kind: 'Screen', label: 'Signal Registry', href: 'Signal Registry.dc.html' },
      { kind: 'Screen', label: 'Weekly Report — W35', href: 'Weekly Report.dc.html' },
      { kind: 'Screen', label: 'Source Universe', href: 'Source Universe.dc.html' },
      { kind: 'Screen', label: 'City Intelligence', href: 'City Intelligence.dc.html' },
      ...['Boxing-gym apparel crossover', 'Y3K chrome accessories', 'Post-Acronym techwear minimalism', 'Logomania second return', 'Archive denim repair culture', 'Crochet menswear, granny-square', 'Leopard print re-normalization', 'Gorpcore office-wear drift', 'French chore-coat workwear', 'Barn jacket suburban adoption', 'Quiet luxury', 'Football blokecore revival'].map(sig),
      ...['Field Notes CPH', 'The Cutting Room', 'Corner Archive', 'The Gradient', 'Softline Journal', 'Mireille P.', 'Hem & Haw', 'Knit District', 'Paper Weight', 'Lagos Stitch Club', 'Desfile Diario', 'Uptown Stoop', 'Velvet Rope Weekly', 'Streetcast MX'].map(src),
      sec('Per-source roundup', 'roundup'), sec('Executive brief', 'brief'),
      sec('Emerging & strengthening', 'signals'), sec('City intelligence', 'cities'),
      sec('Saturation radar', 'saturation'), sec('Contradictions', 'contradictions'),
      sec('Falsifiable hypotheses', 'hypotheses'), sec('Hypothesis ledger', 'ledger'),
      sec('Your watchlist', 'watchlist'),
      ...['New York', 'London', 'Tokyo', 'Milan', 'Seoul', 'Paris', 'Mexico City', 'Lagos', 'Copenhagen', 'Berlin', 'Los Angeles'].map(n => ({ kind: 'City', label: n, href: 'City Intelligence.dc.html' }))
    ];
  }

  currentResults() {
    const q = this.state.query.trim().toLowerCase();
    const all = this.index();
    return (q ? all.filter(e => (e.label + ' ' + e.kind).toLowerCase().includes(q)) : all).slice(0, 9);
  }

  componentDidMount() {
    this._onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        this.setState(s => ({ open: !s.open, query: '', idx: 0 }));
        return;
      }
      if (!this.state.open) return;
      if (e.key === 'Escape') this.setState({ open: false });
      else if (e.key === 'ArrowDown') { e.preventDefault(); this.setState(s => ({ idx: Math.min(s.idx + 1, this.currentResults().length - 1) })); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState(s => ({ idx: Math.max(s.idx - 1, 0) })); }
      else if (e.key === 'Enter') { const r = this.currentResults()[this.state.idx]; if (r) location.href = r.href; }
    };
    window.addEventListener('keydown', this._onKey);
    window.__ciPalette = { open: () => this.setState({ open: true, query: '', idx: 0 }) };
  }

  componentWillUnmount() {
    window.removeEventListener('keydown', this._onKey);
    if (window.__ciPalette) delete window.__ciPalette;
  }

  renderVals() {
    const res = this.currentResults();
    return {
      open: this.state.open,
      query: this.state.query,
      noResults: this.state.open && res.length === 0,
      close: () => this.setState({ open: false }),
      stop: e => e.stopPropagation(),
      onQuery: e => this.setState({ query: e.target.value, idx: 0 }),
      results: res.map((r, i) => ({
        kind: r.kind, label: r.label,
        kindColor: i === this.state.idx ? '#6B1D26' : '#999',
        bg: i === this.state.idx ? '#F2F0E8' : 'transparent',
        go: () => { location.href = r.href; }
      }))
    };
  }
}
</script>
</body>
</html>
